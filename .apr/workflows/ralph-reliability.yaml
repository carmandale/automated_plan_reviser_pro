  ---

  NOW: I'm designing a reliability layer for a development workflow tool called "Ralph". 
  The core problem is NOT network failures - it's that AI agents (Claude, Codex, etc.) 
  are impatient and either:
  1. Skip tool calls entirely
  2. Don't wait for responses  
  3. FABRICATE fake responses instead of using the actual tools

  Carefully review this specification and suggest improvements to make it:
  - More robust against agent misbehavior
  - Simpler (following "working code over perfect code" principle)
  - Actually enforceable

  For each proposed change, provide:
  1. The problem you're addressing
  2. Your proposed solution
  3. Why this is better than the current approach
  4. Any tradeoffs or concerns

  Here is the specification:

  ```
  {{spec}}
  ```

